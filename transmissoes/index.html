<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b4264">
<title>Últimas transmissões | IPDA Setorial Contagem</title>
<meta name="description" content="Assista às transmissões anteriores da IPDA Setorial Contagem Centro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#0b4264;--brand2:#176c96;--gold:#c9a45c;--ink:#17232d;--muted:#687783;--line:#e4eaee;--paper:#fff;--bg:#f6f8fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.6}
header{background:var(--brand);color:white;padding:24px 20px;border-bottom:4px solid var(--gold)}
.topo{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
header h1{font:800 clamp(22px,4vw,32px) Montserrat, sans-serif;margin:0}header p{margin:4px 0 0;color:#e3edf2}
header a{color:white;text-decoration:none;border:1px solid #ffffff70;border-radius:8px;padding:9px 13px;font-weight:700;white-space:nowrap}
main{max-width:1100px;margin:34px auto;padding:0 18px 50px}
.intro{margin-bottom:22px}.intro h2{font:800 25px Montserrat,sans-serif;margin:0 0 5px}.intro p{color:var(--muted);margin:0}
#status{padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.transmissao{overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 24px #0927380d}
.cartaz{width:100%;aspect-ratio:16/9;background:#e9eff2;display:block;object-fit:cover}
.sem-cartaz{display:grid;place-items:center;color:#647783;font-weight:800;font-size:38px}
.info{padding:18px}.info h3{font:800 19px Montserrat,sans-serif;margin:0 0 7px}.data{font-size:12px;color:var(--muted);margin-bottom:14px}
.btn{border:0;border-radius:9px;background:var(--brand);color:white;padding:11px 17px;font-weight:800;cursor:pointer}.btn:hover{background:var(--brand2)}
.player{display:none;margin-top:14px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}.player.aberto{display:block}.player iframe{width:100%;height:100%;border:0}
footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}
@media(max-width:520px){header .topo{align-items:flex-start;flex-direction:column}main{margin-top:24px}}
</style>
</head>
<body>
<header><div class="topo"><div><h1>IPDA Setorial Contagem Centro</h1><p>Últimas transmissões</p></div><a href="https://www.ipda.sitesetorialcontagem.com.br/">← Página inicial</a></div></header>
<main><section class="intro"><h2>Transmissões anteriores</h2><p>Escolha uma transmissão e toque em <strong>Assistir</strong> para abrir o player do YouTube.</p></section>
<div id="status">Carregando transmissões anteriores…</div><section id="lista" class="lista"></section></main>
<footer>IPDA Setorial Contagem Centro</footer>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
firebase.initializeApp({
 apiKey:"AIzaSyC5Ylv9RyBfZ3BN5IgDWGqrldQR9yIbFRA",
 authDomain:"ipda-setorial-contagem.firebaseapp.com",
 databaseURL:"https://ipda-setorial-contagem-default-rtdb.firebaseio.com",
 projectId:"ipda-setorial-contagem",
 storageBucket:"ipda-setorial-contagem.appspot.com",
 messagingSenderId:"815344482867",
 appId:"1:815344482867:web:221f5624f89c1e25468146"
});
const statusEl=document.getElementById("status"), lista=document.getElementById("lista");
function youtubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0];
  if(u.hostname.includes("youtube.com")){
   if(u.searchParams.get("v"))return u.searchParams.get("v");
   const m=u.pathname.match(/\/(?:embed|live|shorts)\/([^/?]+)/);return m?m[1]:"";
  }
 }catch(e){}
 return "";
}
function escapar(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
firebase.database().ref("aovivo/anteriores").on("value",snap=>{
 const items=[];snap.forEach(child=>items.push({id:child.key,...(child.val()||{})}));
 items.sort((a,b)=>(b.encerradaEm||0)-(a.encerradaEm||0));
 lista.innerHTML="";
 if(!items.length){statusEl.style.display="block";statusEl.textContent="Ainda não há transmissões anteriores disponíveis.";return;}
 statusEl.style.display="none";
 items.forEach((item,index)=>{
  const card=document.createElement("article");card.className="transmissao";
  const cartaz=item.cartaz?'<img class="cartaz" src="'+escapar(item.cartaz)+'" alt="Cartaz de '+escapar(item.titulo)+'" loading="lazy">':'<div class="cartaz sem-cartaz">▶</div>';
  const data=item.encerradaEm?new Date(item.encerradaEm).toLocaleDateString("pt-BR"):"";
  card.innerHTML=cartaz+'<div class="info"><h3>'+escapar(item.titulo||"Transmissão da igreja")+'</h3><div class="data">'+(data?'Encerrada em '+data:'')+'</div><button class="btn" type="button">▶ Assistir</button><div class="player"><iframe title="Player do YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></div>';
  const btn=card.querySelector("button"),player=card.querySelector(".player"),iframe=card.querySelector("iframe");
  btn.addEventListener("click",()=>{
   if(player.classList.contains("aberto")){iframe.src="";player.classList.remove("aberto");btn.textContent="▶ Assistir";return;}
   const id=youtubeId(item.youtube||"");
   if(id){iframe.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?autoplay=1";player.classList.add("aberto");btn.textContent="Fechar player";}
   else{window.open(item.youtube,"_blank","noopener");}
  });
  lista.appendChild(card);
 });
},err=>{statusEl.textContent="Não foi possível carregar as transmissões. Verifique a conexão e as permissões do Firebase.";});
</script>
</body></html>
